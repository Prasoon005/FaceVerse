name: Keep Supabase alive

# Free Supabase projects pause after 7 days without activity.
# Ping the app's /api/health route (which queries Postgres) every 3 days.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL secret is not set (e.g. https://your-app.vercel.app/api/health)"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 "$HEALTH_URL"
